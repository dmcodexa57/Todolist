<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mes tâches - TodoList</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<img
    id="logo"
    src="../logo.png"
    alt="Logo de TodoList"
>
    <header>
        <h1>Mes tâches.</h1>
        <h2>Organisez vos tâches simplement.</h2>
        <p id="bienvenue"></p>
    </header>

    <main>

        <section id="ajout-tache">

            <h2>Nouvelle tâche</h2>

            <form id="formulaire-tache">

                <label for="nouvelle-tache">Nom de la tâche</label>

                <input
                    type="text"
                    id="nouvelle-tache"
                    name="nouvelle-tache"
                    placeholder="Nouvelle tâche..."
                >

                <button type="submit">+ Ajouter</button>

            </form>

        </section>

        <section id="liste-taches">

            
            <section id="details-tache" hidden>
    <h2>Détails d'une tâche</h2>
    <h3 id="titre-detail"></h3>
    <p id="statut-detail"></p>
    <button id="retour-taches">Retour aux tâches</button>
   
    <button id="terminer-tache">
    Marquer comme terminée
</button>

<button id="supprimer-tache">
    Supprimer la tâche
</button>
</section>

            <ul id="taches"></ul>

        </section>

       

        <button type="button" id="voir-statistiques">
            Voir les statistiques
        </button>

    </main>
<script src="taches.js"></script>
</body>

</html>
