<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TodoList</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="identite">
            <h1>Todolist</h1>

            <h2 id="sous-titre">
                Organisez vos tâches simplement.
            </h2>
        </div>

  <img
    id="logo"
    src="../logo.png"
    alt="Logo de TodoList"
>
    </header>

    <main>

        <section id="accueil">

            <form id="formulaire">
            <input
                    type="text"
                    id="prenom"
                    name="prenom"
                    placeholder="Entrer votre prénom"
                >

                <button type="submit">
                    Voir la liste des tâches
                </button>

            </form>

        </section>

        <section id="presentation">

            <article>

                <h2>Organisez vos tâches</h2>

                <p>Gardez toutes vos tâches au même endroit.</p>

            </article>

            <article>

                <h2>Suivez vos progrès</h2>

                <p>Visualisez les tâches terminées. </p>

            </article>

            <article>

                <h2>Vos statistiques</h2>

                <p> Consultez votre activité en un coup d'œil.</p>

            </article>

        </section>

    </main>

    <footer>

        <p>Todo List © 2026 — Organisez vos tâches simplement.</p>

    </footer>

    <script src="script.js"></script>

</body>

</html>
