
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiques - TodoList</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Statistiques</h1>
        <h2>Voici un aperçu de votre activité.</h2>
    </header>

    <main>

        <section id="statistiques">

            <article class="carte-stat">
                <h2 id="total-taches">0</h2>
                <p>Nombre total de tâches.</p>
            </article>

            <article class="carte-stat">
                <h2 id="taches-terminees">0</h2>
                <p>Tâches terminées.</p>
            </article>

            <article class="carte-stat">
                <h2 id="taches-a-faire">0</h2>
                <p>Tâches à faire</p>
            </article>

        </section>

        <button type="button" id="retour-statistiques">
            Retour
        </button>

    </main>

    <script src="statistiques.js"></script>

</body>
</html>
