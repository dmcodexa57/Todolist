
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Détails de la tâche - TodoList</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <img id="logo" src="../logo.png" alt="Logo de TodoList">

    <header>
        <h1>Détails de la tâche.</h1>
        <h2>Consultez et gérez votre tâche simplement.</h2>
    </header>

    <main>

        <section id="details-tache">

            <h2 id="titre-detail"></h2>

            <p id="statut-detail"></p>

            <button type="button" id="terminer-tache">
                Marquer comme terminée
            </button>

            <button type="button" id="supprimer-tache">
                Supprimer la tâche
            </button>

            <button type="button" id="retour-taches">
                Retour aux tâches
            </button>

        </section>

    </main>

    <script src="details.js"></script>

</body>
</html>
